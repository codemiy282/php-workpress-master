services:
  db:
    image: mariadb:11.4
    container_name: wordpress_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wordpress:
    image: wordpress:php8.3-fpm-alpine
    container_name: wordpress_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
    volumes:
      - wp_data:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
    networks:
      - wp_network

  nginx:
    image: nginx:alpine
    container_name: wordpress_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - wordpress
    volumes:
      - wp_data:/var/www/html:ro
      - wp_uploads:/var/www/html/wp-content/uploads:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wp_network

  mailpit:
    image: axllent/mailpit
    container_name: wordpress_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - wp_network

  cli:
    image: wordpress:cli
    container_name: wordpress_cli
    volumes:
      - wp_data:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
      - ./setup-wordpress.sh:/setup-wordpress.sh:ro
      - ./setup-homepage.php:/setup-homepage.php:ro
      - ./generate-products.php:/generate-products.php:ro
      - ./setup-fluentform.php:/setup-fluentform.php:ro
      - ./setup-fluentsmtp.php:/setup-fluentsmtp.php:ro
      - ./custom-my-account.php:/custom-my-account.php:ro
      - ./generate-blog-posts.php:/generate-blog-posts.php:ro
      - ./setup-rankmath.php:/setup-rankmath.php:ro
      - ./setup-litespeed.php:/setup-litespeed.php:ro
      - ./setup-wordfence.php:/setup-wordfence.php:ro
      - ./setup-updraft.php:/setup-updraft.php:ro
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wp_network


volumes:
  db_data:
    driver: local
  wp_data:
    driver: local
  wp_uploads:
    driver: local

networks:
  wp_network:
    driver: bridge
